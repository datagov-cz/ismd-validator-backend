# ==============================================
# ISMD Validator Backend - Build Override
# ==============================================
# Use with the base file to build from local source instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# No credentials needed: the build pulls only public Maven Central dependencies.
# ==============================================

services:
  ismd-validator-backend:
    image: ismd-validator-backend:local
    pull_policy: never
    build:
      # Default `.` works when running from this directory directly.
      # When composed from ismd-infrastructure via `-f`, set VALIDATOR_BACKEND_PATH
      # to the path of this repo (e.g. ../ismd-validator-backend).
      context: ${VALIDATOR_BACKEND_PATH:-.}
      dockerfile: ismd-backend-validator/Dockerfile

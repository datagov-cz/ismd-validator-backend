name: Reusable Test Workflow
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      enforce_coverage:
        description: "Fail workflow when JaCoCo check is not met"
        required: false
        type: boolean
        default: true
      coverage_minimum:
        description: "JaCoCo line coverage minimum ratio (0.00-1.00)"
        required: false
        type: string
        default: "0.00"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with coverage
        working-directory: ismd-backend-validator
        # Inputs reach the script through env, never as ${{ }} inside run:.
        env:
          ENFORCE_COVERAGE: ${{ inputs.enforce_coverage }}
          COVERAGE_MINIMUM: ${{ inputs.coverage_minimum }}
        run: |
          if ! [[ "$COVERAGE_MINIMUM" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]]; then
            echo "::error::coverage_minimum must be a ratio between 0.00 and 1.00"
            exit 1
          fi
          if [ "$ENFORCE_COVERAGE" = "true" ]; then
            ./mvnw clean verify "-Djacoco.line.minimum=$COVERAGE_MINIMUM"
          else
            ./mvnw clean test jacoco:report "-Djacoco.line.minimum=$COVERAGE_MINIMUM"
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report-${{ github.run_id }}
          path: ismd-backend-validator/target/site/jacoco
          if-no-files-found: warn

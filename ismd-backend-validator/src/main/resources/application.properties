spring.application.name=ismd-backend-validator

# Validation rules configuration
# Keys must match sanitized filenames (lowercase, no .ttl extension).
# Use bracket notation: without it Spring's map binder silently drops non-ASCII characters from the key.
# Non-ASCII characters must be \uXXXX-escaped: .properties files are read as ISO-8859-1.
# Startup fails if an enabled key does not match a loaded rule (RuleManager.verifyEnabledRulesLoaded).

# === LOCAL RULES ===
# ERRORS
# local-název-slovníku
validation.rules.enabled[local-n\u00e1zev-slovn\u00edku]=true
# local-název-pojmu
validation.rules.enabled[local-n\u00e1zev-pojmu]=true
# local-duplikátní-iri-pojmů
validation.rules.enabled[local-duplik\u00e1tn\u00ed-iri-pojm\u016f]=true
# local-duplikátní-název-pojmů
validation.rules.enabled[local-duplik\u00e1tn\u00ed-n\u00e1zev-pojm\u016f]=true
# local-charakteristika-hodnota-číselník
validation.rules.enabled[local-charakteristika-hodnota-\u010d\u00edseln\u00edk]=true
validation.rules.enabled[local-charakteristika-hodnota-typ]=true
validation.rules.enabled[local-charakteristika-hodnota-regex]=true

# WARNINGS
# local-popis-slovníku
validation.rules.enabled[local-popis-slovn\u00edku]=true
validation.rules.enabled[local-zdroj-pojmu]=true
validation.rules.enabled[local-definice-bez-zdroje]=true
# local-zdroj-ani-související-zdroj
validation.rules.enabled[local-zdroj-ani-souvisej\u00edc\u00ed-zdroj]=true
# local-osamocené-pojmy
validation.rules.enabled[local-osamocen\u00e9-pojmy]=true
# local-alternativní-název-stejný
validation.rules.enabled[local-alternativn\u00ed-n\u00e1zev-stejn\u00fd]=true
validation.rules.enabled[local-typ-pojmu]=true

# INFO
validation.rules.enabled[local-charakteristiky-rpp-pojmu]=true

# DISABLED (not in requirements)
# local-povinné-údaje-pojmu
validation.rules.enabled[local-povinn\u00e9-\u00fadaje-pojmu]=false
validation.rules.enabled[local-popis-pojmu]=false

# === GLOBAL RULES ===
# ERRORS
# global-slovník-s-jiným-iri-stejným-názvem
validation.rules.enabled[global-slovn\u00edk-s-jin\u00fdm-iri-stejn\u00fdm-n\u00e1zvem]=true
# global-slovník-se-stejným-iri-jiným-názvem
validation.rules.enabled[global-slovn\u00edk-se-stejn\u00fdm-iri-jin\u00fdm-n\u00e1zvem]=true
# global-pojem-se-stejným-iri-jiným-názvem
validation.rules.enabled[global-pojem-se-stejn\u00fdm-iri-jin\u00fdm-n\u00e1zvem]=true

# INFO
# global-pojem-se-stejným-iri
validation.rules.enabled[global-pojem-se-stejn\u00fdm-iri]=true
# global-slovník-se-stejným-iri
validation.rules.enabled[global-slovn\u00edk-se-stejn\u00fdm-iri]=true

# DISABLED (not in requirements)
# global-pojem-s-jiným-iri-stejným-názvem
validation.rules.enabled[global-pojem-s-jin\u00fdm-iri-stejn\u00fdm-n\u00e1zvem]=false
# Directory containing SHACL rule files
validation.rules.rules-directory=classpath:validation/rules/
# Default validation timing
validation.rules.default-timing=before_export
# Validation execution settings
validation.rules.timeout-ms=10000
# Max wait for a free SHACL worker before a request is rejected as busy
validation.rules.queue-timeout-ms=30000
# SHACL worker threads (0 = max(2, CPU count)); env VALIDATION_RULES_POOL_SIZE
validation.rules.pool-size=0
validation.rules.cache-results=true
validation.rules.continue-on-rule-error=true
# Ontology containing VIOLATION download settings.
# WARNING: true also DISABLES the error gate: conversion output is returned even when validation has ERRORs.
# Keep false in production (dev/localhost only).
validation.rules.enable-ontology-violation-download=false

# Global validation configuration (corpus-aware cross-vocabulary checks).
# Empty endpoint disables all global checks (fail-open) — this is the zero-config default,
# so a direct upload to the validator works with no external dependency.
validation.global.sparql.endpoint=
validation.global.sparql.timeout=10000
validation.global.circuit-breaker.failure-threshold=5
validation.global.circuit-breaker.cooldown-ms=30000

# Concept filtering configuration
# Enable/disable concept filtering (default: false)
concept.filter.enabled=false
# Filter regex for concepts - Unicode (only used if enabled=true)
concept.filter.regex=https:\/\/slovn\u00EDk\.gov\.cz\/neimportovat.*


# CORS: comma-separated exact browser origins of the frontend(s), e.g. https://validator.example.gov.cz
# Required in production/stage; server-to-server callers (ismd-tool-backend) do not need an entry.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Context Path Configuration
# Base path for the application to support multi-app hosting on the same domain
# Can be overridden by env var SERVER_SERVLET_CONTEXT_PATH
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/validujeme}

# Springdoc/Swagger Configuration
# Paths are relative to the context-path
# Swagger UI will be at: ${server.servlet.context-path}/swagger-ui.html
# OpenAPI spec will be at: ${server.servlet.context-path}/v3/api-docs

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_FILE_SIZE:10MB}

# Actuator: liveness/readiness groups for Azure Container Apps probes
#   /validujeme/actuator/health/liveness, /validujeme/actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Graceful shutdown: let in-flight conversions finish on redeploy
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Production profile (SPRING_PROFILES_ACTIVE=production, set in the Dockerfile).
# Every value here can be overridden by the env var shown; see README.md for the full list.

# Global (corpus-aware) validation is on in production. Requires egress to the endpoint;
# if unreachable, checks fail open (circuit breaker) and only local rules apply.
validation.global.sparql.endpoint=${VALIDATION_GLOBAL_SPARQL_ENDPOINT:https://data.gov.cz/slovn%C3%ADky/sparql}

# Never return conversion output when validation has ERRORs.
validation.rules.enable-ontology-violation-download=false
